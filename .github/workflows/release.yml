name: Release

# `node scripts/release.ts 0.2.0` pushes the tag v0.2.0; this workflow then builds the installers into a draft
# GitHub release. Review the draft, then publish it on the Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gate:
    name: Release checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # every bundled adhan needs a confirmed source and licence (assets/adhan/adhan.json)
      - run: npm run check:release
      - run: npm run data:fonts

  build:
    name: Build (${{ matrix.name }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04 # older glibc: the AppImage and .deb run on more distributions
            args: --bundles deb,rpm,appimage
          - name: Windows
            os: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ahd ${{ github.ref_name }}
          releaseBody: Installers for Windows and Linux. The notes are added when all files are ready.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: Stable names, SHA256SUMS and notes
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      # Copies with version-free names, so the website can link to
      # https://github.com/<owner>/ahd/releases/latest/download/<name> (a direct download of the newest release).
      - name: Stable file names and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$REPO" --pattern '*' --skip-existing
          rm -f SHA256SUMS Ahd-windows-* Ahd-linux-*
          cp *_x64-setup.exe Ahd-windows-x64-setup.exe
          cp *_x64_en-US.msi Ahd-windows-x64.msi
          cp *_amd64.deb Ahd-linux-amd64.deb
          cp *.x86_64.rpm Ahd-linux-x86_64.rpm
          cp *_amd64.AppImage Ahd-linux-x86_64.AppImage
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" Ahd-windows-* Ahd-linux-* SHA256SUMS --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md"
