# Flatpak manifest for Flathub (see docs/RELEASE_LINUX.md). Flathub requires open-source apps to be built entirely
# from source, offline: the npm and cargo dependencies come from generated source lists (node-sources.json,
# cargo-sources.json) made with flatpak-builder-tools from package-lock.json and src-tauri/Cargo.lock.
# In the Flathub repository, also add https://github.com/flathub/shared-modules as the "shared-modules" submodule.
# Not yet test-built: run flatpak-builder as described in docs/RELEASE_LINUX.md before submitting.
id: io.github.mohamedamineam.Ahd
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: ahd
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # the adhan
  - --socket=pulseaudio
  # optional online features (place search, map, library) — each can be turned off in the app
  - --share=network
  # tray icon / top-bar indicator (AppIndicator; libxapp is not in the runtime) and notifications with actions
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: ahd
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      env:
        CARGO_HOME: /run/build/ahd/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/ahd/flatpak-node/cache
        npm_config_cache: /run/build/ahd/flatpak-node/npm-cache
        npm_config_offline: 'true'
    sources:
      - type: git
        url: https://github.com/mohamedamineam/ahd.git
        tag: v0.1.0
      - node-sources.json
      - cargo-sources.json
    build-commands:
      - npm ci --offline
      - npm run build
      # tauri/custom-protocol: serve the built frontend from the binary (what `tauri build` enables)
      - cargo build --release --offline --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/ahd /app/bin/ahd
      # bundled resources (adhan recordings, offline places, tray icons): Tauri looks in ../lib/<product>
      - mkdir -p /app/lib/3ahd
      - cp -a assets/adhan assets/data /app/lib/3ahd/
      - cp -a src-tauri/icons/tray /app/lib/3ahd/tray
      - install -Dm644 packaging/linux/io.github.mohamedamineam.Ahd.metainfo.xml /app/share/metainfo/io.github.mohamedamineam.Ahd.metainfo.xml
      - >-
        sed -e 's/{{categories}}/Utility;/' -e 's/{{comment}}/Prayer times, adhan, Quran, adhkar and qibla/' -e 's/{{exec}}/ahd/g'
        -e 's/{{icon}}/io.github.mohamedamineam.Ahd/' -e 's/{{name}}/3ahd/' packaging/linux/ahd.desktop > io.github.mohamedamineam.Ahd.desktop
      - install -Dm644 io.github.mohamedamineam.Ahd.desktop /app/share/applications/io.github.mohamedamineam.Ahd.desktop
      - for s in 128x128 256x256 512x512; do install -Dm644 packaging/flatpak/icons/$s/io.github.mohamedamineam.Ahd.png /app/share/icons/hicolor/$s/apps/io.github.mohamedamineam.Ahd.png; done
      - install -Dm644 packaging/flatpak/icons/scalable/io.github.mohamedamineam.Ahd.svg /app/share/icons/hicolor/scalable/apps/io.github.mohamedamineam.Ahd.svg
      - install -Dm644 packaging/flatpak/icons/symbolic/io.github.mohamedamineam.Ahd-symbolic.svg /app/share/icons/hicolor/symbolic/apps/io.github.mohamedamineam.Ahd-symbolic.svg
